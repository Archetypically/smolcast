<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>smolcast social card</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/_media/media.css" />
    <script src="/app.js" defer></script>
  </head>
  <!-- Rendered to public/og.png at 1200 × 630 by scripts/render.mjs. -->
  <body class="card">
    <div class="card-copy">
      <p class="card-brand"><img src="/favicon.svg" alt="" width="44" height="44" />smolcast</p>
      <h1>The <span class="smol">smol</span> command palette for Windows<span class="dot">.</span></h1>
      <p class="card-lead">
        Apps, files, clipboard, emoji, scripts and snippets behind one hotkey. One 7 MB executable.
      </p>
      <p class="card-url">smolcast.evanlee.engineer</p>
    </div>
    <div class="stage card-stage" id="stage">
      <div class="palette" id="palette"></div>
      <div class="dismissed" id="dismissed" hidden></div>
    </div>
  </body>
</html>
