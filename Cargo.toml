[package]
name = "smolcast"
version = "1.0.0-rc.1"
description = "Minimal Windows-native command palette (launcher, clipboard, emoji, scripts)"
authors = ["Evan Lee"]
license = "MIT"
# The author's site until smolcast.evanlee.engineer is live.
homepage = "https://evanlee.engineer"
repository = "https://github.com/Archetypically/smolcast"
edition = "2024"
rust-version = "1.95"

[lib]
name = "smolcast"
path = "src/lib.rs"

# Host-compatible dependencies used by src/lib.rs and the core modules.
# They compile on Linux so `cargo test --lib` exercises the pure data logic.
[dependencies]
fuzzy-matcher = "=0.3.7"
image = { version = "=0.25.10", default-features = false, features = ["bmp"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.6"
toml_edit = { version = "=0.25.15", default-features = false, features = ["parse", "display"] }
unicode-segmentation = "=1.13.3"

# Windows-only UI/OS stack. These never compile on the Linux host; the binary
# and every win/ module are gated on cfg(windows).
[target.'cfg(windows)'.dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "default_fonts"] }
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }
global-hotkey = "=0.8.0"
raw-window-handle = "=0.6.2"
tray-icon = "=0.25.1"
windows = { version = "=0.62.2", features = [
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Search",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Lets the exe load the DLLs it imports from its own folder, as Windows does
# by default. Release builds look only in System32 (build.rs) so a DLL
# downloaded next to smolcast.exe cannot be loaded into it. Only CI's desktop
# smoke test turns this on, for Mesa's software opengl32.dll.
app-folder-dlls = []

# Embeds the exe's icon and version information (build.rs).
[build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
