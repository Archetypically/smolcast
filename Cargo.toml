[package]
name = "smolcast"
version = "0.1.0"
description = "Minimal Windows-native command palette (launcher, clipboard, emoji, scripts)"
license = "MIT"
edition = "2024"
rust-version = "1.95"

[lib]
name = "smolcast"
path = "src/lib.rs"

# Host-compatible dependencies used by src/lib.rs and the core modules.
# They compile on Linux so `cargo test --lib` exercises the pure data logic.
[dependencies]
fuzzy-matcher = "=0.3.7"
image = { version = "=0.25.10", default-features = false, features = ["bmp"] }
parking_lot = "0.12"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.6"
unicode-segmentation = "=1.13.3"

# Windows-only UI/OS stack. These never compile on the Linux host; the binary
# and every win/ module are gated on cfg(windows).
[target.'cfg(windows)'.dependencies]
directories = "=6.0.0"
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "default_fonts"] }
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }
global-hotkey = "=0.8.0"
tray-icon = "=0.25.1"
windows = { version = "=0.62.2", features = [
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
