name: ci

on:
  push:
    branches: [main]
  pull_request:

# Every job only checks out the code and uploads artifacts, which use the
# runner's own cache and artifact tokens rather than the GITHUB_TOKEN.
permissions:
  contents: read

# A newer push to the same PR or branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: ""

jobs:
  windows-msvc:
    name: Windows MSVC build + lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup target add x86_64-pc-windows-msvc --toolchain 1.98.1
      # Dependencies rarely change; reuse their build between runs. The smoke
      # test builds them a second time (tests ignore `panic = "abort"`), so
      # the key names that set: an exact hit never re-saves. Saving after a
      # failure keeps a red run from rebuilding everything next time.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: with-smoke-deps
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (all targets)
        run: cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings
      # Clippy has type-checked every target; the release build proves it links.
      - name: Build release
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      # build.rs embeds the icon and version information (decision 026).
      - name: Check the embedded file properties
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/smolcast.exe"
          $info = (Get-Item $exe).VersionInfo
          $info | Format-List ProductName, FileVersion, LegalCopyright
          Add-Type -AssemblyName System.Drawing
          if ($info.ProductName -ne "smolcast" -or -not [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exe))) {
            Write-Error "smolcast.exe is missing its version or icon resource"
            exit 1
          }
      # The Microsoft Store package (plan §15), so a manifest or makepri
      # problem shows here rather than at a release tag. Only release.yml's
      # package goes to the Store; this one is thrown away.
      - name: Check the MSIX packaging
        shell: pwsh
        run: |
          # Only the numeric part: MSIX has no prerelease form, and this step
          # checks the packaging, not the version.
          $line = Select-String -Path Cargo.toml -Pattern '^version = "([0-9.]+)' | Select-Object -First 1
          scripts/package_msix.ps1 -Exe target/x86_64-pc-windows-msvc/release/smolcast.exe -Version $line.Matches[0].Groups[1].Value -OutDir "$env:RUNNER_TEMP\msix"
      - name: Capture release size and import table
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/smolcast.exe"
          if (Get-Command llvm-objdump -ErrorAction SilentlyContinue) {
            llvm-objdump -p $exe | Out-File -Encoding utf8 artifacts-imports.txt -Append
          } else {
            "llvm-objdump unavailable; size only" | Out-File -Encoding utf8 artifacts-imports.txt
          }
          "bytes=$((Get-Item $exe).Length)" | Out-File -Encoding utf8 artifacts-size.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: |
            target/x86_64-pc-windows-msvc/release/smolcast.exe
            artifacts-size.txt
            artifacts-imports.txt
          if-no-files-found: error
      # The release exe on the runner's desktop, driven with real input
      # (decision 029). The runner is throwaway, so the test may type, click
      # and reset smolcast's state there. It runs after the artifacts upload
      # so a failure still reports size and imports.
      # The runner has no GPU and only OpenGL 1.1; Glow needs 2.0+. Mesa's
      # software OpenGL beside the exe stands in: the smoke build turns on
      # `app-folder-dlls`, so the exe's folder wins over System32 (release
      # builds look in System32 only). The uploaded release is unaffected.
      - name: Software OpenGL for the smoke test
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\mesa.7z"
          Invoke-WebRequest https://github.com/pal1000/mesa-dist-win/releases/download/24.0.7/mesa3d-24.0.7-release-msvc.7z -OutFile $archive
          # A replaced release asset must not run on the runner.
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne 'D694107F6215FB250DE957D3849252CF517B109885492D8607DCB0D479E57D03') {
            Write-Error "The Mesa archive does not match its pinned SHA-256"
            exit 1
          }
          7z x $archive "-o$env:RUNNER_TEMP\mesa" x64 -y | Out-Null
          Copy-Item "$env:RUNNER_TEMP\mesa\x64\*.dll" target/x86_64-pc-windows-msvc/release/
      - name: Desktop smoke test
        timeout-minutes: 10
        env:
          SMOLCAST_SMOKE_DESKTOP: disposable
        run: cargo test --locked --release --target x86_64-pc-windows-msvc --features app-folder-dlls --test smoke -- --ignored --nocapture
      - name: Upload the failure screenshot
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-failure
          path: smoke-failure.png
          if-no-files-found: ignore

  website:
    name: Website format + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's preinstalled Node runs the pinned tools from the lockfile.
      - name: Install the pinned tools
        run: npm ci
      - name: Check formatting
        run: npx prettier --check .
      - name: Lint JavaScript
        run: npx eslint .
      - name: Validate HTML
        run: npx html-validate "public/**/*.html" "media/*.html"
      - name: Check shared chrome, tokens, markdown twins, sitemap and llms.txt
        run: node scripts/sync.mjs --check

  linux-gnu:
    name: Linux host tests + GNU cross-link
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install MinGW x86-64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - name: Install pinned toolchain and GNU target
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup target add x86_64-pc-windows-gnu --toolchain 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Host library tests
        run: cargo test --locked --lib
      - name: Build release (GNU)
        run: cargo build --locked --release --target x86_64-pc-windows-gnu
      - name: Capture release size
        run: |
          bytes=$(stat -c %s target/x86_64-pc-windows-gnu/release/smolcast.exe)
          echo "bytes=$bytes" > artifacts-size.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-gnu-release
          path: |
            target/x86_64-pc-windows-gnu/release/smolcast.exe
            artifacts-size.txt
          if-no-files-found: error
