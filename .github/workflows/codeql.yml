name: codeql

# Advanced setup instead of GitHub's default setup, because the default setup
# cannot analyze Rust. Rust, Actions workflows, the website's TypeScript and
# the generator scripts' Python are scanned without a build (`build-mode:
# none`), so the Windows-only crate needs no Windows runner here.
# Action references must stay `uses: owner/repo@<commit> # vX.Y.Z`; Dependabot
# moves the SHA and the version comment together.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so new queries also run over code that has not changed.
    - cron: '27 5 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
