version: '3'

vars:
  TARGET: '{{if eq OS "windows"}}x86_64-pc-windows-msvc{{else}}x86_64-pc-windows-gnu{{end}}'
  CARGO: '{{if .CARGO_HOME}}{{.CARGO_HOME}}/bin/cargo{{if eq OS "windows"}}.exe{{end}}{{else if eq OS "windows"}}{{.USERPROFILE}}/.cargo/bin/cargo.exe{{else}}{{.HOME}}/.cargo/bin/cargo{{end}}'

tasks:
  default:
    desc: List available commands
    cmds:
      - task --list

  up:
    desc: Install development dependencies (Windows or Debian/Ubuntu Linux)
    preconditions:
      - sh: '[ "{{ARCH}}" = "amd64" ] && { [ "{{OS}}" = "windows" ] || [ "{{OS}}" = "linux" ]; }'
        msg: Setup currently supports x86-64 Windows and Debian/Ubuntu Linux only.
    cmds:
      - cmd: bash scripts/setup.sh
        platforms: [linux]
      - cmd: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/setup.ps1
        platforms: [windows]

  build:
    desc: Build the Windows application (after implementation begins)
    preconditions: &application
      - sh: test -f Cargo.toml
        msg: No Cargo package. Run task up, then see README.md.
    cmds:
      - '"{{.CARGO}}" build --locked --target {{.TARGET}}'

  build-release:
    desc: Build the release Windows application
    preconditions: *application
    cmds:
      - '"{{.CARGO}}" build --locked --release --target {{.TARGET}}'

  stage:
    desc: Cross-build in WSL and copy the exe to a Windows-local drive (PROFILE=debug|release)
    platforms: [linux]
    vars:
      PROFILE: '{{.PROFILE | default "release"}}'
      STAGE_DIR: '{{.STAGE_DIR | default "/mnt/e/Projects/smolcast"}}'
    preconditions:
      - sh: test -d "$(dirname '{{.STAGE_DIR}}')"
        msg: 'Staging parent for {{.STAGE_DIR}} is missing; set STAGE_DIR to a Windows-drive path under /mnt.'
    cmds:
      - task: '{{if eq .PROFILE "release"}}build-release{{else}}build{{end}}'
      - mkdir -p '{{.STAGE_DIR}}/{{.PROFILE}}'
      # A running exe cannot be overwritten but can be renamed: move it aside so
      # staging works while the previous build is still resident.
      # Earlier moved-aside builds are deleted unless they are still running.
      - for old in '{{.STAGE_DIR}}/{{.PROFILE}}'/smolcast.old-*.exe; do rm -f "$old" 2>/dev/null || true; done
      - '[ ! -e "{{.STAGE_DIR}}/{{.PROFILE}}/smolcast.exe" ] || mv "{{.STAGE_DIR}}/{{.PROFILE}}/smolcast.exe" "{{.STAGE_DIR}}/{{.PROFILE}}/smolcast.old-$(date +%s).exe"'
      - cp 'target/{{.TARGET}}/{{.PROFILE}}/smolcast.exe' '{{.STAGE_DIR}}/{{.PROFILE}}/smolcast.exe'
      - echo 'Staged {{.STAGE_DIR}}/{{.PROFILE}}/smolcast.exe'

  run:
    desc: Build and launch on Windows, or stage to drive E and launch via WSL Windows interop
    preconditions:
      - sh: '[ "{{OS}}" = "windows" ] || test -e /proc/sys/fs/binfmt_misc/WSLInterop'
        msg: Run on Windows or WSL with Windows interop enabled; Wine is not a verification target.
    cmds:
      - cmd: '"{{.CARGO}}" build --locked --target {{.TARGET}}'
        platforms: [windows]
      - cmd: './target/{{.TARGET}}/debug/smolcast.exe {{.CLI_ARGS}}'
        platforms: [windows]
      - cmd: task stage PROFILE=debug
        platforms: [linux]
      - cmd: '"{{.STAGE_DIR | default "/mnt/e/Projects/smolcast"}}/debug/smolcast.exe" {{.CLI_ARGS}}'
        platforms: [linux]

  check:
    desc: Type-check for Windows
    preconditions: *application
    cmds:
      - '"{{.CARGO}}" check --locked --target {{.TARGET}}'

  clippy:
    desc: Lint Windows code and tests
    preconditions: *application
    cmds:
      - '"{{.CARGO}}" clippy --locked --target {{.TARGET}} --all-targets -- -D warnings'

  fmt:
    desc: Format Rust source
    preconditions: *application
    cmds:
      - '"{{.CARGO}}" fmt --all'

  fmt-check:
    desc: Check Rust formatting without changes
    preconditions: *application
    cmds:
      - '"{{.CARGO}}" fmt --all -- --check'

  test:
    desc: Run portable library tests on the host
    preconditions: *application
    cmds:
      - '"{{.CARGO}}" test --locked --lib'

  clean:
    desc: Remove Cargo build artifacts
    preconditions: *application
    cmds:
      - '"{{.CARGO}}" clean'
